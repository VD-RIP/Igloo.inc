name: Deploy Status

on:
  push:
    branches:
      - main

jobs:
  deployment:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://igloo-replica.netlify.app
    steps:
      - name: Set deployment status
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          environment_url: https://igloo-replica.netlify.app
          state: 'success'
          deployment_id: ${{ github.event.deployment.id }}
        continue-on-error: true

      - name: Deploy log
        run: echo "Deployed to https://igloo-replica.netlify.app"
